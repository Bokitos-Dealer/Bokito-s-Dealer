<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover: What if the internet died for a week?</title>
<style>
  @font-face { font-family: 'Mont'; font-weight: 900; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'InterW'; font-weight: 800; src: url(/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; }
  .cover { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff; font-family: 'Mont', sans-serif; }
  .art { position: absolute; inset: 0; }
  .art svg { display: block; }
  .art svg { display: block; width: 1080px; height: 1920px; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,10,28,0.92) 0%, rgba(8,10,28,0.55) 26%, rgba(8,10,28,0) 46%, rgba(8,10,28,0) 66%, rgba(8,10,28,0.85) 100%); }
  .title { position: absolute; left: 50px; right: 50px; top: 240px; text-align: center; }
  .l1 { font-weight: 900; font-size: 92px; line-height: 1.02; letter-spacing: -1px; text-shadow: 0 6px 24px rgba(0,0,0,0.8); }
  .l2 { font-weight: 900; font-size: 168px; line-height: 0.95; letter-spacing: -3px; margin-top: 14px; color: #ffd84a;
    text-shadow: 0 0 30px rgba(255,200,60,0.6), 0 8px 26px rgba(0,0,0,0.6); }
  .tag { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: 'InterW'; font-weight: 800; font-size: 40px; letter-spacing: 0.16em; color: #fff;
    text-shadow: 0 0 18px rgba(0,0,0,0.95), 0 2px 6px rgba(0,0,0,0.9); }
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="art" id="art"></div>
  <div class="shade"></div>
  <div class="title"><div class="l1">WHAT IF THE INTERNET</div><div class="l2">DIED FOR A WEEK?</div></div>
  <div class="tag">HERE'S WHAT WOULD HAPPEN</div>
</div>
<script type="module">
  const t = parseFloat(new URLSearchParams(location.search).get('t') || '2.9');
  const { svgAt } = await import('/scenarios/internet-down-2d.js');
  document.getElementById('art').innerHTML = svgAt(t);
  document.fonts.ready.then(() => document.body.dataset.ready = '1');
</script>
</body>
</html>

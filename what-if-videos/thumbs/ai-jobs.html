<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover: What if AI took every job?</title>
<style>
  @font-face { font-family: 'Mont'; font-weight: 900; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Mont'; font-weight: 800; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'InterW'; font-weight: 800; src: url(/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; }
  .cover { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff; font-family: 'Mont', sans-serif; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .tower .bg { inset: auto; left: -60px; right: -60px; top: 400px; height: 2160px; background-size: cover; background-position: center top; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 260px); mask-image: linear-gradient(180deg, transparent 0, #000 260px); }
  .tower { background: radial-gradient(ellipse 80% 40% at 50% 30%, #23173a 0%, #090c1c 70%); }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(3,6,18,0.92) 0%, rgba(3,6,18,0.7) 24%, rgba(3,6,18,0.0) 46%, rgba(3,6,18,0.0) 70%, rgba(3,6,18,0.75) 100%); }
  .title { position: absolute; left: 60px; right: 60px; top: 270px; text-align: center; }
  .l1 { font-weight: 900; font-size: 92px; line-height: 1.0; letter-spacing: -1px; text-shadow: 0 6px 24px rgba(0,0,0,0.7); }
  .l2 { font-weight: 900; font-size: 168px; line-height: 0.95; letter-spacing: -3px; margin-top: 14px; color: #6ff6ff;
    text-shadow: 0 0 30px rgba(60,220,255,0.75), 0 0 80px rgba(40,160,255,0.55), 0 8px 26px rgba(0,0,0,0.6); }
  .bar { position: absolute; left: 110px; right: 110px; top: 1330px; padding: 26px 34px 30px; border-radius: 30px;
    background: rgba(6,10,22,0.72); box-shadow: 0 0 0 3px rgba(111,246,255,0.55), 0 20px 60px rgba(0,0,0,0.5); }
  .bar .row { display: flex; justify-content: space-between; align-items: baseline; font-family: 'InterW'; font-weight: 800; font-size: 34px; letter-spacing: 0.14em; }
  .bar .row b { font-family: 'Mont'; font-weight: 900; font-size: 74px; letter-spacing: 0; color: #6ff6ff; text-shadow: 0 0 22px rgba(60,220,255,0.7); }
  .track { height: 30px; margin-top: 18px; border-radius: 15px; background: linear-gradient(90deg, #6ff6ff, #2a8dff); box-shadow: 0 0 24px rgba(60,200,255,0.7); }
  .tag { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: 'InterW'; font-weight: 800; font-size: 36px; letter-spacing: 0.16em; color: #ffd34d;
    text-shadow: 0 0 18px rgba(0,0,0,0.9); }
  /* variant: the screen close-up */
  .screen .title { top: 230px; }
  .screen .l2 { font-size: 150px; }
  .screen .shade { background: linear-gradient(180deg, rgba(3,6,18,0.95) 0%, rgba(3,6,18,0.75) 26%, rgba(3,6,18,0.0) 48%, rgba(3,6,18,0.0) 66%, rgba(3,6,18,0.8) 100%); }
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="bg" id="bg"></div>
  <div class="shade"></div>
  <div class="title"><div class="l1">WHAT IF AI TOOK</div><div class="l2" id="l2">EVERY JOB?</div></div>
  <div class="tag" id="tag">THE ENDING ISN’T WHAT YOU THINK</div>
</div>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'tower';
  document.getElementById('bg').style.backgroundImage = `url(/thumbs/ai-jobs-bg-${v}.jpg)`;
  if (v !== 'screen') document.getElementById('cover').classList.add('tower');
  if (v === 'screen') { document.getElementById('cover').classList.add('screen'); document.getElementById('l2').textContent = 'YOUR JOB?'; }
</script>
</body>
</html>

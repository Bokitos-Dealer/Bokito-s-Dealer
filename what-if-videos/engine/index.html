<!doctype html>
<html>
<head>

<link rel="stylesheet" href="/engine/style.css">

<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="tint"></div>
  <div id="vignette"></div>
  <canvas id="rain" width="1080" height="1920"></canvas>
  <canvas id="grain" width="270" height="480"></canvas>

    <div class="e-title"></div>
    <div class="e-fact"></div>
    <div class="e-div"><span></span><i>✦</i><span></span></div>
    <div class="e-brand"></div>
    <div class="e-handle"></div>
    <div class="e-follow">FOLLOW FOR THE NEXT ONE</div>
    <div class="e-ask">WHAT SHOULD HAPPEN NEXT? TELL ME BELOW</div>
  </div>
</div>
<script type="module" src="/engine/main.js"></script>

</html>
